apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
data:
  env.js: |
    (function(window) {
      window.__env = window.__env || {};
      window.__env.apiUrl = 'http://localhost:8080';
    }(window));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: random-order-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            - name: env-config
              mountPath: /usr/share/nginx/html/env.js
              subPath: env.js
      volumes:
        - name: env-config
          configMap:
            name: frontend-env
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
