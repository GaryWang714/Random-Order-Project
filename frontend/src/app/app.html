<div style="max-width: 800px; margin: 40px auto; font-family: sans-serif; padding: 0 20px;">

  <h1>Orders</h1>

<!--  <form (ngSubmit)="createOrder()" #orderForm="ngForm" style="margin-bottom: 24px; padding: 16px; border: 1px solid #ddd; border-radius: 8px;">-->
<!--    <h2>Create Order</h2>-->
<!--    <label>Total: </label>-->
<!--    <input type="number" [(ngModel)]="newOrder.total" name="total" min="0.01" step="0.01" required style="margin-right: 12px;" />-->
<!--    <button type="submit">Submit</button>-->
<!--  </form>-->

  <div style="margin-bottom: 24px; padding: 16px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Create Order</h2>
    <label>Total: </label>
    <input type="number" [(ngModel)]="newOrder.total" name="total" style="margin-right: 12px;" />
    <button (click)="createOrder()">Submit</button>
  </div>

  <table style="width: 100%; border-collapse: collapse;">
    <thead>
    <tr style="background: #f4f4f4;">
      <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">ID</th>
      <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Total</th>
      <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Status</th>
      <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Actions</th>
    </tr>
    </thead>
    <tbody>
    @for (order of orders; track order.clientId) {
    <tr>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ order.id }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ order.total }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ order.status }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">
        <button (click)="deleteOrder(order.id!)">Delete</button>
      </td>
    </tr>
    }
    </tbody>
  </table>

</div>
